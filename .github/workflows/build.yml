name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      # Boots a headless server with the mod loaded and runs every GameTest.
      # The process exit code is the number of failed required tests, so any failure fails the job.
      - name: Run GameTests
        run: ./gradlew runGameTestServer

      # Fails if the committed generated resources no longer match what the data generators produce.
      - name: Check generated data is up to date
        run: |
          ./gradlew runData
          git diff --exit-code -- src/generated ':!src/generated/resources/.cache'

      - uses: actions/upload-artifact@v7
        with:
          name: constructionwand
          path: build/libs/*.jar

  client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The client needs a display; Xvfb provides a virtual one with Mesa software OpenGL.
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri

      # Starts a real client, runs the scripted tests in src/clienttest, and fails unless the report says PASS.
      - name: Run client tests
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew clientTest

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-test-report
          path: |
            build/clienttest/report.txt
            run/clienttest/logs/latest.log
